services:
  postgres:
    image: postgres:15
    container_name: doctorek-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: doctorek-redis
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: doctorek-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: doctorek-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-doctorek}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-doctorek123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: doctorek-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 9080
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "9080:9080"
    volumes:
      - ./docker/keycloak-themes:/opt/keycloak/themes
    depends_on:
      postgres:
        condition: service_healthy
    # Health endpoint (KC_HEALTH_ENABLED) est servi sur le port de management 9000,
    # interne au conteneur. L'image quay n'a pas de curl → sonde via /dev/tcp (bash).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q 'UP'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  app:
    build: .
    container_name: doctorek-app
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KEYCLOAK_ISSUER_URI: http://localhost:9080/realms/doctorek
      KEYCLOAK_JWK_SET_URI: http://keycloak:9080/realms/doctorek/protocol/openid-connect/certs
      KEYCLOAK_URL: http://keycloak:9080
      KEYCLOAK_REALM: doctorek
      KEYCLOAK_ADMIN_CLIENT_ID: doctorek-admin-cli
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      # Mail — defaults to MailHog (dev); set MAIL_* in .env to use a real SMTP (Brevo)
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@doctorek.ma}
      MAIL_ENABLED: "true"
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-doctorek}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-doctorek123}
      MINIO_BUCKET: doctorek-uploads
      # Assistant IA — desactive tant que SPRING_AI_MODEL_CHAT n'est pas pose.
      # Pour l'activer : SPRING_AI_MODEL_CHAT=google-genai + GEMINI_API_KEY dans .env
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      AGENT_TRANSCRIPTION_ENABLED: ${AGENT_TRANSCRIPTION_ENABLED:-true}
      GEMINI_TRANSCRIBE_API_KEY: ${GEMINI_TRANSCRIBE_API_KEY:-${GEMINI_API_KEY:-}}
      GEMINI_TRANSCRIBE_MODEL: ${GEMINI_TRANSCRIBE_MODEL:-gemini-3.5-transcribe}

volumes:
  postgres_data:
  minio_data:
