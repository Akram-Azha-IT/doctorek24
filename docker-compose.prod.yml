# ── Doctorek — stack production (VPS unique + Caddy TLS auto) ──────────
# Usage : docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Prérequis : DNS A records app.$DOMAIN, api.$DOMAIN, auth.$DOMAIN → IP du VPS

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - app
      - keycloak

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    # --import-realm : importe docker/doctorek-realm.json au premier démarrage
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # TLS terminé par Caddy — Keycloak parle HTTP derrière le proxy
      KC_HOSTNAME: https://auth.${DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./docker/keycloak-themes:/opt/keycloak/themes
      - ./docker/doctorek-realm.json:/opt/keycloak/data/import/doctorek-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: https://app.${DOMAIN}
      FRONTEND_URL: https://app.${DOMAIN}
      VMC_ENCRYPTION_KEY: ${VMC_ENCRYPTION_KEY}
      # Issuer public (doit matcher l'iss des tokens), JWKS en interne
      KEYCLOAK_ISSUER_URI: https://auth.${DOMAIN}/realms/doctorek
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/doctorek/protocol/openid-connect/certs
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: doctorek
      KEYCLOAK_ADMIN_CLIENT_ID: doctorek-admin-cli
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: doctorek-uploads
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx640m
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ./doctorek-frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_KEYCLOAK_URL: https://auth.${DOMAIN}
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_KEYCLOAK_ID: doctorek-frontend
      AUTH_KEYCLOAK_ISSUER: https://auth.${DOMAIN}/realms/doctorek
      AUTH_URL: https://app.${DOMAIN}
      AUTH_TRUST_HOST: "true"
    depends_on:
      - app

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
