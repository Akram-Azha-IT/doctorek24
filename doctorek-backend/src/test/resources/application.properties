# Test configuration — overrides main application.properties for all tests
# Dummy 256-bit AES key (32 zero bytes, base64-encoded) — safe for tests only
doctorek.carte.encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Disable Flyway in unit/slice tests — no real DB
spring.flyway.enabled=false

# In-memory H2 not used; slice tests mock repos, so skip datasource auto-config
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
