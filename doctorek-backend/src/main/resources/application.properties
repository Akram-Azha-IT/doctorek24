spring.application.name=doctorek
# Active profile: override with -Dspring.profiles.active=prod in production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ================================
# SERVER
# ================================
server.port=8080

# ================================
# DATABASE - PostgreSQL
# ================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doctorek_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:doctorek_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:doctorek_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================
# JPA / HIBERNATE
# ================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Batch writes — reduces round-trips for bulk inserts/updates
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# PostgreSQL LOB — avoids contextual creation warnings
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Let HikariCP manage autocommit — removes redundant SET autocommit calls per query.
# MUST pair with hikari.auto-commit=false below, else commits fail in scheduled/async tasks.
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.datasource.hikari.auto-commit=false

# ================================
# FLYWAY
# ================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=auth

# ================================
# HIKARICP — dev defaults (prod overrides in application-prod.properties)
# ================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ================================
# REDIS
# ================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ================================
# CACHE TTL
# ================================
spring.cache.redis.ttl-minutes.medecins=10
spring.cache.redis.ttl-minutes.creneaux=5

# ================================
# CORS
# ================================
cors.allowed-origins=http://localhost:3000

# ================================
# ACTUATOR
# ================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ================================
# FRONTEND
# ================================
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ================================
# GOOGLE WALLET
# ================================
google.wallet.enabled=${GOOGLE_WALLET_ENABLED:false}
google.wallet.issuer-id=${GOOGLE_WALLET_ISSUER_ID:}
google.wallet.class-id=${GOOGLE_WALLET_CLASS_ID:carte_medicale_doctorek}
google.wallet.service-account-path=${GOOGLE_WALLET_SA_PATH:}
google.wallet.hero-secret=${GOOGLE_WALLET_HERO_SECRET:}

# ================================
# MAIL (SMTP) - US-F12 rappels
# ================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
doctorek.mail.from=${MAIL_FROM:no-reply@doctorek.ma}
doctorek.mail.enabled=${MAIL_ENABLED:true}

# ================================
# CARTE VIRTUELLE — encryption
# ================================
# Production: set VMC_ENCRYPTION_KEY env var (32 random bytes, base64-encoded)
# Dev fallback: dummy key — NEVER use in production
doctorek.carte.encryption-key=${VMC_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

# ================================
# KEYCLOAK — OAuth2 Resource Server
# ================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/doctorek}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:9080/realms/doctorek/protocol/openid-connect/certs}

# Keycloak Admin REST API (for user provisioning on registration)
keycloak.admin.url=${KEYCLOAK_URL:http://localhost:9080}
keycloak.admin.realm=${KEYCLOAK_REALM:doctorek}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:doctorek-admin-cli}
# No fallback: must come from the environment (.env / secret manager)
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
# Token lifetimes configured on startup (seconds). 1800=30min, 28800=8h
keycloak.realm.access-token-lifespan=${KEYCLOAK_ACCESS_TOKEN_LIFESPAN:1800}
keycloak.realm.sso-session-max-lifespan=${KEYCLOAK_SSO_SESSION_MAX_LIFESPAN:28800}

# ================================
# OPENAPI / SPRINGDOC
# ================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ================================
# FILE UPLOAD (dossier module — MinIO)
# ================================
doctorek.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
doctorek.minio.access-key=${MINIO_ACCESS_KEY:doctorek}
doctorek.minio.secret-key=${MINIO_SECRET_KEY:doctorek123}
doctorek.minio.bucket=${MINIO_BUCKET:doctorek-uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Fuseau de reference pour les raisonnements en heure murale (rappels, creneaux).
# Le conteneur tourne en UTC : sans cela les rappels partiraient decales.
doctorek.timezone=Africa/Casablanca

# ================================
# CLOTURE AUTOMATIQUE DES RDV + INVITATION A NOTER
# ================================
# Le medecin ne clot pas ses rendez-vous en consultation : le creneau ecoule fait foi,
# sans quoi aucun rendez-vous n'atteint TERMINE et aucun avis n'est possible.
# La cloture suit la FIN du creneau (heure + duree). La marge ne sert qu'aux cabinets
# qui debordent systematiquement ; a 0 le patient peut noter des sa sortie.
doctorek.rdv.cloture-marge-minutes=${RDV_CLOTURE_MARGE_MINUTES:0}
doctorek.rdv.cloture-cron=${RDV_CLOTURE_CRON:0 * * * * *}
# Invitation le lendemain a 10h : une relance a la sortie du cabinet est ignoree.
doctorek.rdv.invitation-avis-cron=${RDV_INVITATION_AVIS_CRON:0 0 10 * * *}

# ================================
# AGENT IA (assistant conversationnel)
# ================================
# Commutateur unique du module. Par defaut "none" : l'autoconfiguration Spring AI
# ne se declenche pas, l'application demarre sans cle API et /api/v1/agent/chat
# repond 503. Pour activer : SPRING_AI_MODEL_CHAT=google-genai + GEMINI_API_KEY.
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
# Cle de l'API Gemini (palier gratuit, console Google AI Studio). Jamais en dur.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.6-flash}
# Temperature basse : on veut une selection d'outils stable, pas de la creativite.
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.google.genai.chat.options.max-output-tokens=512

# Dictée vocale de l'agent — appel direct Spring Boot -> Gemini Transcribe.
# Active en développement dès qu'une clé Gemini est présente. Le compose de
# production force AGENT_TRANSCRIPTION_ENABLED=false tant que l'opérateur ne l'active pas.
doctorek.agent.transcription.enabled=${AGENT_TRANSCRIPTION_ENABLED:true}
doctorek.agent.transcription.api-key=${GEMINI_TRANSCRIBE_API_KEY:${GEMINI_API_KEY:}}
doctorek.agent.transcription.model=${GEMINI_TRANSCRIBE_MODEL:gemini-3.5-transcribe}
doctorek.agent.transcription.max-bytes=${AGENT_TRANSCRIPTION_MAX_BYTES:2097152}
doctorek.agent.transcription.max-duration-seconds=30.5
doctorek.agent.transcription.max-concurrent=${AGENT_TRANSCRIPTION_MAX_CONCURRENT:2}
doctorek.agent.transcription.quota-requests=${AGENT_TRANSCRIPTION_QUOTA:10}
doctorek.agent.transcription.quota-window=5m
doctorek.agent.transcription.connect-timeout=5s
doctorek.agent.transcription.read-timeout=45s

# Plafonds du module (voir AgentProperties). Bornes de cout avant tout :
# un tour consomme autant d'appels au modele qu'il enchaine d'outils.
doctorek.agent.max-outils-par-tour=${AGENT_MAX_OUTILS:6}
doctorek.agent.historique-max-messages=${AGENT_HISTORIQUE_MAX:12}
doctorek.agent.historique-ttl=${AGENT_HISTORIQUE_TTL:30m}
doctorek.agent.quota-messages=${AGENT_QUOTA_MESSAGES:20}
doctorek.agent.quota-fenetre=${AGENT_QUOTA_FENETRE:5m}
doctorek.agent.max-resultats-recherche=${AGENT_MAX_RESULTATS:5}
doctorek.agent.max-jours-creneaux=${AGENT_MAX_JOURS_CRENEAUX:7}
