spring.application.name=doctorek
# Active profile: override with -Dspring.profiles.active=prod in production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ================================
# SERVER
# ================================
server.port=8080

# ================================
# DATABASE - PostgreSQL
# ================================
spring.datasource.url=jdbc:postgresql://localhost:5432/doctorek_db
spring.datasource.username=doctorek_user
spring.datasource.password=doctorek_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================
# JPA / HIBERNATE
# ================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ================================
# FLYWAY
# ================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=auth

# ================================
# HIKARICP — dev defaults (prod overrides in application-prod.properties)
# ================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ================================
# REDIS
# ================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ================================
# CACHE TTL
# ================================
spring.cache.redis.ttl-minutes.medecins=10
spring.cache.redis.ttl-minutes.creneaux=5

# ================================
# CORS
# ================================
cors.allowed-origins=http://localhost:3000

# ================================
# ACTUATOR
# ================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ================================
# MAIL (SMTP) - US-F12 rappels
# ================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
doctorek.mail.from=${MAIL_FROM:no-reply@doctorek.ma}
doctorek.mail.enabled=${MAIL_ENABLED:true}

# ================================
# CARTE VIRTUELLE — encryption
# ================================
# Production: set VMC_ENCRYPTION_KEY env var (32 random bytes, base64-encoded)
# Dev fallback: dummy key — NEVER use in production
doctorek.carte.encryption-key=${VMC_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

# ================================
# OPENAPI / SPRINGDOC
# ================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ================================
# FILE UPLOAD (dossier module)
# ================================
doctorek.upload.dir=${UPLOAD_DIR:${user.home}/doctorek-uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
