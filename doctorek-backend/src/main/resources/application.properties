spring.application.name=doctorek
# ================================
# SERVER
# ================================
server.port=8080

# ================================
# DATABASE - PostgreSQL
# ================================
spring.datasource.url=jdbc:postgresql://localhost:5432/doctorek_db
spring.datasource.username=doctorek_user
spring.datasource.password=doctorek_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================
# JPA / HIBERNATE
# ================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ================================
# FLYWAY
# ================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=auth

# ================================
# REDIS
# ================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ================================
# CORS
# ================================
cors.allowed-origins=http://localhost:3000

# ================================
# ACTUATOR
# ================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ================================
# MAIL (SMTP) - US-F12 rappels
# ================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
doctorek.mail.from=${MAIL_FROM:no-reply@doctorek.ma}
doctorek.mail.enabled=${MAIL_ENABLED:true}
