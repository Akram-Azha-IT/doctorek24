# ================================
# PROD PROFILE — all values from env vars
# ================================

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP — prod pool sizing
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# CORS — production frontend URL
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
doctorek.mail.from=${MAIL_FROM}
doctorek.mail.enabled=true

# Encryption
doctorek.carte.encryption-key=${VMC_ENCRYPTION_KEY}

# No SQL logging in prod
spring.jpa.show-sql=false

# Actuator — health only in prod
management.endpoints.web.exposure.include=health

# Google Wallet
app.frontend-url=${FRONTEND_URL}
google.wallet.enabled=${GOOGLE_WALLET_ENABLED:false}
google.wallet.issuer-id=${GOOGLE_WALLET_ISSUER_ID:}
google.wallet.class-id=${GOOGLE_WALLET_CLASS_ID:carte_medicale_doctorek}
google.wallet.service-account-path=${GOOGLE_WALLET_SA_PATH:}
google.wallet.hero-secret=${GOOGLE_WALLET_HERO_SECRET}

# API docs — never exposed in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator — health only, details for authorized callers
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
