version: 2
updates:
  # Backend — dépendances Maven
  - package-ecosystem: maven
    directory: /doctorek-backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    ignore:
      # Bumps majeurs = breaking (Spring Boot 4 exige Java 21+, minio 9 change l'API).
      # Les correctifs sécurité arrivent en patch/minor sur les lignes actuelles.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # Frontend — dépendances npm
  - package-ecosystem: npm
    directory: /doctorek-frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      # Regroupe les patchs mineurs pour limiter le bruit de PR
      minor-and-patch:
        update-types: [minor, patch]

  # Images de base Docker
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /doctorek-frontend
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # Actions GitHub elles-mêmes
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
