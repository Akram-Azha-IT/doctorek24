version: 2
updates:
  # Backend — dépendances Maven
  - package-ecosystem: maven
    directory: /doctorek-backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]

  # Frontend — dépendances npm
  - package-ecosystem: npm
    directory: /doctorek-frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      # Regroupe les patchs mineurs pour limiter le bruit de PR
      minor-and-patch:
        update-types: [minor, patch]

  # Images de base Docker
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /doctorek-frontend
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  # Actions GitHub elles-mêmes
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
