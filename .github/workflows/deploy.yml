name: Deploy production

# Declenchement manuel uniquement. Doctorek sert de vrais patients et n'a pas
# d'environnement de preproduction : une fusion sur master ne doit pas partir en
# production sans decision explicite.
on:
  workflow_dispatch:
    inputs:
      services:
        description: Services a deployer
        type: choice
        options: [tous, api, web]
        default: tous

# Deux deploiements simultanes construiraient sur les memes coeurs et se
# marcheraient dessus au moment du redemarrage des conteneurs.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Construire sur la VM et mettre en service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Charger la cle SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Faire confiance a l'hote
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Le depot fait foi. Un scp manuel depuis un poste de travail pouvait
      # envoyer un etat different de la branche deployee : ici la VM recoit
      # exactement le commit choisi.
      - name: Envoyer le code sur la VM
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'target' \
            ./ "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/doctorek-src/"

      # La construction a lieu sur la VM, confinee a un coeur : pas de runner
      # ARM gratuit pour un depot prive, et l'emulation QEMU a deja fait
      # exploser un job a six heures sur "npm ci".
      - name: Construire et mettre en service
        run: |
          ssh "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "chmod +x ~/doctorek-src/scripts/deploy-vm.sh && \
             IMAGE_TAG=${{ github.sha }} ~/doctorek-src/scripts/deploy-vm.sh ${{ inputs.services }}"

      - name: Verifier que la production repond
        run: |
          sleep 45
          for h in app api auth; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$h.${{ vars.DOMAIN }}")
            echo "$h -> $code"
            [ "$code" -lt 500 ] || exit 1
          done
