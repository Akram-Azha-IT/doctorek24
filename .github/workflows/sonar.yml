name: SAST (SonarQube Cloud)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar-backend:
    name: SonarCloud — backend (Java)
    runs-on: ubuntu-latest
    # Secrets requis : SONAR_TOKEN (+ organisation/projectKey créés sur sonarcloud.io)
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: doctorek-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # analyse de blame précise

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build + analyse Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORG }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_BACKEND }}

  sonar-frontend:
    name: SonarCloud — frontend (TypeScript)
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: doctorek-frontend
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_FRONTEND }}
            -Dsonar.sources=app,features,components,lib
