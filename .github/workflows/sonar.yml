name: SAST (SonarQube Community self-hosted)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Secrets requis : SONAR_TOKEN
# Variables requises : SONAR_ENABLED=true, SONAR_HOST_URL (https://sonar.<domaine>),
#                      SONAR_PROJECT_KEY_BACKEND, SONAR_PROJECT_KEY_FRONTEND

jobs:
  sonar-backend:
    name: SonarQube — backend (Java)
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: doctorek-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # analyse de blame précise

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build + analyse Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_BACKEND }}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.coverage.exclusions=**/dto/**,**/entity/**,**/config/**,**/*Application.java,**/*Controller.java,**/enums/**,**/GlobalExceptionHandler.java,**/service/EmailService.java
          -Dsonar.qualitygate.wait=true

  sonar-frontend:
    name: SonarQube — frontend (TypeScript)
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: doctorek-frontend/package-lock.json

      - name: Tests + couverture (lcov)
        working-directory: doctorek-frontend
        run: npm ci && npm run test:coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: doctorek-frontend
          # Couverture exigée sur lib/features/components (tests unitaires).
          # app/** exclu de l'exigence de couverture : pages Next.js = surface
          # d'intégration, couvertes par les tests E2E (pas en unitaire).
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_FRONTEND }}
            -Dsonar.sources=app,features,components,lib
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions=app/**,**/*.test.*,vitest.*.ts,features/messaging/components/ChatWindow.tsx,features/home/**
            -Dsonar.qualitygate.wait=true
