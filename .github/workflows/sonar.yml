name: SAST (SonarQube Community self-hosted)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Secrets requis : SONAR_TOKEN
# Variables requises : SONAR_ENABLED=true, SONAR_HOST_URL (https://sonar.<domaine>),
#                      SONAR_PROJECT_KEY_BACKEND, SONAR_PROJECT_KEY_FRONTEND

jobs:
  sonar-backend:
    name: SonarQube — backend (Java)
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: doctorek-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # analyse de blame précise

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build + analyse Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_BACKEND }}
          -Dsonar.qualitygate.wait=true

  sonar-frontend:
    name: SonarQube — frontend (TypeScript)
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: doctorek-frontend
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_FRONTEND }}
            -Dsonar.sources=app,features,components,lib
            -Dsonar.qualitygate.wait=true
